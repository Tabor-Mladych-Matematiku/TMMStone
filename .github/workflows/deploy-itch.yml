name: Build and deploy WebGL to itch.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: itch-webgl-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build WebGL and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Validate deployment configuration
        shell: bash
        env:
          ITCH_USERNAME: ${{ vars.ITCH_USERNAME }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          test -n "$ITCH_USERNAME" || { echo "Missing repository variable ITCH_USERNAME"; exit 1; }
          test -n "$ITCH_GAME" || { echo "Missing repository variable ITCH_GAME"; exit 1; }
          test -n "$BUTLER_API_KEY" || { echo "Missing repository secret BUTLER_API_KEY"; exit 1; }

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build WebGL player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          targetPlatform: WebGL
          unityVersion: auto
          buildsPath: build
          buildName: WebGL

      - name: Verify WebGL output
        shell: bash
        run: test -f build/WebGL/WebGL/index.html

      - name: Save WebGL build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TMMStone-WebGL-${{ github.sha }}
          path: build/WebGL/WebGL
          if-no-files-found: error
          retention-days: 14

      - name: Install itch.io butler
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            --output butler.zip \
            https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"

      - name: Upload WebGL build to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCH_USERNAME: ${{ vars.ITCH_USERNAME }}
          ITCH_GAME: ${{ vars.ITCH_GAME }}
        run: >-
          "$RUNNER_TEMP/butler/butler" push
          --userversion "${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}"
          build/WebGL/WebGL
          "$ITCH_USERNAME/$ITCH_GAME:html5"
